<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patitas Cafeteras · Panel de Control</title>
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <!-- SIDEBAR OSCURO -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="img/logo.png" alt="Logo" class="brand-logo" />
        <div class="brand-text">
          <h1>Patitas Cafeteras</h1>
          <p>Peluquería y spa canino</p>
        </div>
      </div>

      <nav class="menu">
        <span class="menu-titulo">Gestión</span>
        <a href="#/inicio" data-ruta="inicio">Inicio</a>
        <a href="#/nuevo" data-ruta="nuevo">Nuevo turno</a>
        <a href="#/turnos" data-ruta="turnos">Turnos</a>
        
        <span class="menu-titulo">Taller</span>
        <a href="#/pruebas" data-ruta="pruebas">Pruebas de la API</a>
        <a href="#/proyecto" data-ruta="proyecto">El proyecto</a>
      </nav>

      <div class="side-pie">
        <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;">
          <span class="chip" id="chipN">N = –</span>
          <span class="chip chip-accent" id="chipRecargo">Recargo: –</span>
        </div>
        <p style="font-size:11px; color:#64748b; line-height:1.4;">Arquitectura Cliente-Servidor · CIAF</p>
      </div>
    </aside>

    <!-- AREA PRINCIPAL -->
    <div class="main">
      <header class="topbar">
        <button class="burger" id="burger">Menú</button>
        <h2 id="tituloPagina">Inicio</h2>
      </header>
      <main class="vista" id="vista"></main>
    </div>
  </div>

  <div id="toasts"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
